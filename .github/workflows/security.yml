name: security
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python static analysis and dependency audit
        run: |
          pip install bandit pip-audit
          bandit -r backend/api backend/ai backend/config -ll -x "**/migrations/**,**/test_*.py" || true
          pip-audit -r backend/requirements.txt || true
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true
