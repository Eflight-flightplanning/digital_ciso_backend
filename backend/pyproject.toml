[tool.uv]
# Minimum versions of transitive dependencies with published vulnerabilities (pip-audit, 27 Oct 2026).
# azure-cli-core is raised so that paramiko 2.x (vulnerable, no longer needed by azure-cli-core) drops out.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "azure-cli-core>=2.91",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "httpx2>=2.12.0",
    "multidict>=6.9.1",
    "oauthlib>=4.0.0",
    "opentelemetry-api>=1.45.1",
    "pillow>=13.0.0",
    "pyjwt>=2.15.0",
    "setuptools>=84.1.0",
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",
]

