version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Digital CISO — Development Services
# Starts: PostgreSQL 16 on port 5433, Redis on port 6379
# Usage:  docker compose -f docker-compose.dev.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16
    container_name: digital_ciso_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_ciso_django
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_ciso_django"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: digital_ciso_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
